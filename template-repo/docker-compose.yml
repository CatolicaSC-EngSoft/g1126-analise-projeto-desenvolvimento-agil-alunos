# PostgreSQL local — usado a partir da UNIDADE 3, quando o grupo refatora a
# camada de dados de SQLite para PostgreSQL. Na Unidade 1 você não precisa disto.
#
#   docker compose up -d     inicia
#   docker compose down      para
#   docker compose down -v   para e apaga os dados
services:
  db:
    image: postgres:16-alpine
    container_name: pratocheio-db
    environment:
      POSTGRES_USER: pratocheio
      POSTGRES_PASSWORD: pratocheio
      POSTGRES_DB: pratocheio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pratocheio"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
